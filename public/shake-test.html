<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f9d85b">
  <title>Becky — provocare</title>
  <style>
    :root { color: #233448; background: #f9d85b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; }
    body { margin: 0; background: #f9d85b; }
    button { font: inherit; }
    .screen { position: relative; width: 100vw; height: 100vh; height: 100dvh; min-height: 100svh; overflow: hidden; }
    .screen::before, .screen::after { position: absolute; content: ''; width: 42vw; height: 42vw; max-width: 270px; max-height: 270px; border-radius: 50%; opacity: .45; }
    .screen::before { top: -12vw; right: -10vw; background: #fff4b8; }
    .screen::after { bottom: -16vw; left: -12vw; background: #f6a7b4; }
    .intro { display: grid; place-items: center; padding: 28px 24px; text-align: center; background: radial-gradient(circle at 50% 30%, #fff5bd, transparent 42%), #f9d85b; }
    .intro-content, .challenge-content { position: relative; z-index: 1; width: min(520px, 100%); }
    .logo { display: inline-grid; width: 62px; height: 62px; place-items: center; border: 5px solid #233448; border-radius: 22px; background: #fffdf7; font-size: 31px; transform: rotate(-7deg); box-shadow: 0 8px 0 #233448; }
    .eyebrow { margin-top: 27px; color: #b46732; font-size: 11px; font-weight: 950; letter-spacing: .18em; }
    h1 { max-width: 480px; margin: 10px auto 0; font-size: clamp(42px, 12vw, 76px); line-height: .94; letter-spacing: -.06em; }
    .intro-copy { max-width: 370px; margin: 20px auto 0; color: #66532f; font-size: 17px; font-weight: 650; line-height: 1.45; }
    .shake-illustration { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 28px auto 30px; color: #233448; font-size: 58px; }
    .phone { display: grid; width: 64px; height: 104px; place-items: center; border: 6px solid #233448; border-radius: 18px; background: #dff3f1; font-size: 31px; box-shadow: 0 7px 0 #233448; animation: wobble 1.2s ease-in-out infinite; }
    .arrows { font-size: 36px; font-weight: 950; letter-spacing: -.35em; }
    @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    .primary { min-height: 60px; padding: 0 28px; border: 0; border-radius: 999px; background: #233448; color: #fffdf7; font-size: 17px; font-weight: 900; box-shadow: 0 9px 0 #b46732; cursor: pointer; }
    .primary:active { transform: translateY(5px); box-shadow: 0 4px 0 #b46732; }
    .hint { margin: 24px 0 0; color: #806b3d; font-size: 12px; font-weight: 700; }
    .challenge { display: none; place-items: center; padding: 28px 24px; background: radial-gradient(circle at 50% 32%, #fff7c9, transparent 45%), #f9d85b; }
    .challenge.is-visible { display: grid; }
    .challenge.is-settling .challenge-content { animation: settle .78s cubic-bezier(.2,.8,.3,1); }
    .challenge.is-settling .challenge-emoji { animation: rumble .78s ease-out; }
    .challenge-content.nudge { animation: nudge .28s ease-out; }
    .challenge-content { display: grid; justify-items: center; text-align: center; }
    .challenge-emoji { margin: 23px 0 10px; font-size: clamp(76px, 22vw, 136px); line-height: 1; filter: drop-shadow(0 8px 0 rgba(35,52,72,.1)); }
    .challenge h2 { max-width: 570px; margin: 0; font-size: clamp(38px, 11vw, 70px); line-height: .98; letter-spacing: -.055em; }
    .challenge-text { max-width: 430px; margin: 18px auto 0; color: #66532f; font-size: clamp(17px, 4.5vw, 22px); font-weight: 700; line-height: 1.35; }
    @keyframes settle { 0% { opacity: .35; transform: translateY(-26px) scale(1.08); filter: blur(9px); } 55% { opacity: .75; transform: translateY(7px) scale(.98); filter: blur(3px); } 100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @keyframes rumble { 0%,100% { transform: rotate(0); } 18% { transform: rotate(-8deg) scale(1.08); } 38% { transform: rotate(7deg) scale(.98); } 58% { transform: rotate(-3deg); } }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px) rotate(-1deg); } 75% { transform: translateX(7px) rotate(1deg); } }
    .waiting-emoji { margin: 23px 0 10px; font-size: clamp(76px, 22vw, 136px); line-height: 1; animation: waiting 1.6s ease-in-out infinite; }
    @keyframes waiting { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) scale(1.04); } }
    #status { display: none; }
    .lock { position: absolute; z-index: 3; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; display: grid; width: 38px; height: 38px; place-items: center; border: 2px solid #233448; border-radius: 50%; background: rgba(255,253,247,.8); font-size: 17px; transform: translateX(-50%); }
    .lock.unlocked { background: #dff3f1; }
  </style>
</head>
<body>
  <main class="screen intro" id="intro">
    <div class="intro-content">
      <span class="logo" aria-hidden="true">✦</span>
      <div class="eyebrow">BECKY · JOACĂ-TE</div>
      <h1>Zgâlțâie și primește o provocare!</h1>
      <p class="intro-copy">Un joc scurt pentru corpuri curioase. Scutură telefonul și vezi ce misiune apare.</p>
      <div class="shake-illustration" aria-hidden="true"><span class="arrows">‹‹</span><span class="phone">✦</span><span class="arrows">››</span></div>
      <button class="primary" id="start" type="button">Pornește jocul</button>
      <p class="hint">Ai nevoie doar de telefon și puțin chef de joacă.</p>
    </div>
  </main>

  <main class="screen challenge" id="challenge" aria-live="polite">
    <div class="challenge-content">
      <div class="waiting-emoji" id="challenge-emoji">🫨</div>
      <h2 id="challenge-title">Acum zgâlțâie!</h2>
      <p class="challenge-text" id="challenge-text">Prima zgâlțâire puternică alege o provocare pentru tine.</p>
    </div>
    <div class="lock" id="lock" aria-label="Provocarea este blocată">🔒</div>
    <p id="status" role="status"></p>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const challengeScreen = document.getElementById('challenge');
    const start = document.getElementById('start');
    const status = document.getElementById('status');
    const lock = document.getElementById('lock');
    const title = document.getElementById('challenge-title');
    const text = document.getElementById('challenge-text');
    const emoji = document.getElementById('challenge-emoji');
    const challenges = [
      { emoji: '🐒', title: 'Imită un animal', text: 'Alege un animal și fă mișcarea sau sunetul lui timp de 10 secunde.' },
      { emoji: '🌈', title: 'Găsește o culoare', text: 'Atinge sau arată ceva din cameră care are culoarea aleasă de tine.' },
      { emoji: '🗿', title: 'Statuie dansatoare', text: 'Dansează 10 secunde, apoi îngheață într-o poziție amuzantă.' }
    ];
    let activeChallenge = -1;
    let cooldownUntil = 0;
    let previous = null;
    let previousOrientation = null;
    let motionEvents = 0;
    let orientationEvents = 0;
    let lastTap = 0;
    let settling = false;

    function nudge() {
      challengeScreen.querySelector('.challenge-content').classList.remove('nudge');
      requestAnimationFrame(() => challengeScreen.querySelector('.challenge-content').classList.add('nudge'));
    }

    function showChallenge() {
      if (settling) return;
      settling = true;
      challengeScreen.classList.add('is-settling');
      status.textContent = 'Se așează provocarea…';
      setTimeout(() => revealChallenge(), 780);
    }

    function revealChallenge() {
      let next = activeChallenge;
      while (next === activeChallenge) next = Math.floor(Math.random() * challenges.length);
      activeChallenge = next;
      const item = challenges[next];
      emoji.textContent = item.emoji;
      emoji.className = 'challenge-emoji';
      title.textContent = item.title;
      text.textContent = item.text;
      cooldownUntil = Date.now() + 10000;
      lock.textContent = '🔒';
      lock.classList.remove('unlocked');
      challengeScreen.classList.remove('is-settling');
      settling = false;
    }

    function motion(event) {
      motionEvents += 1;
      const linear = event.acceleration;
      const acceleration = linear && [linear.x, linear.y, linear.z].some(Number.isFinite) ? linear : event.accelerationIncludingGravity;
      if (!acceleration) return;
      const current = [acceleration.x || 0, acceleration.y || 0, acceleration.z || 0];
      const hasLinear = linear && [linear.x, linear.y, linear.z].some(Number.isFinite);
      const change = hasLinear ? Math.hypot(...current) : previous ? Math.hypot(...current.map((axis, index) => axis - previous[index])) : 0;
      previous = current;
      const threshold = hasLinear ? 12 : 8;
      if (change > threshold) {
        if (Date.now() >= cooldownUntil) showChallenge();
        else nudge();
      }
    }

    function orientation(event) {
      orientationEvents += 1;
      const current = [event.alpha || 0, event.beta || 0, event.gamma || 0];
      const change = previousOrientation ? Math.hypot(...current.map((axis, index) => Math.abs(axis - previousOrientation[index]))) : 0;
      previousOrientation = current;
      if (change > 30) {
        if (Date.now() >= cooldownUntil) showChallenge();
        else nudge();
      }
    }

    async function startGame() {
      start.disabled = true;
      try {
        if (!('DeviceMotionEvent' in window)) throw new Error('unsupported');
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          if (await DeviceMotionEvent.requestPermission() !== 'granted') throw new Error('denied');
        }
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          if (await DeviceOrientationEvent.requestPermission() !== 'granted') throw new Error('denied');
        }
        window.addEventListener('devicemotion', motion);
        window.addEventListener('deviceorientation', orientation);
        intro.style.display = 'none';
        challengeScreen.classList.add('is-visible');
        status.textContent = 'Zgâlțâie telefonul pentru următoarea provocare.';
        setTimeout(() => {
          if (!motionEvents && !orientationEvents) status.textContent = 'Nu primesc mișcare. Încearcă Chrome pe telefon și verifică permisiunea senzorului.';
        }, 3000);
      } catch (error) {
        start.disabled = false;
        status.textContent = error.message === 'denied' ? 'Permisiunea pentru mișcare a fost refuzată.' : 'Browserul nu oferă acces la senzorul de mișcare.';
      }
    }

    start.addEventListener('click', startGame);
    document.addEventListener('touchend', event => {
      const now = Date.now();
      if (now - lastTap > 0 && now - lastTap < 350) {
        cooldownUntil = 0;
        lock.textContent = '🔓';
        lock.classList.add('unlocked');
        lastTap = 0;
        event.preventDefault();
      } else lastTap = now;
    }, { passive: false });
  </script>
</body>
</html>
