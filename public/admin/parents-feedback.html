<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback părinți</title><style>body{margin:0;padding:40px;font:16px system-ui;color:#263746;background:#f6efe5}main{max-width:1100px;margin:auto}h1{font-size:42px}.stats{display:flex;gap:16px;flex-wrap:wrap}.stat{padding:20px 28px;border:1px solid #b4dbde;border-radius:20px;background:#fffdf9}.stat b{display:block;font-size:32px}.panel{margin-top:24px;padding:24px;border-radius:20px;background:#fffdf9;border:1px solid #b4dbde}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-top:1px solid #eadfd2;text-align:left}.stars{color:#dfa931;letter-spacing:2px}</style></head><body><main><a href="/admin?view=parents">← Meniu părinți</a><h1>Feedback întrebări</h1><section class="stats"><div class="stat">Feedback-uri<b id="total">—</b></div><div class="stat">Sesiuni<b id="sessions">—</b></div><div class="stat">Medie<b id="average">—</b></div></section><section class="panel"><h2>Întrebări evaluate</h2><table><thead><tr><th>Activitate</th><th>Întrebare</th><th>Medie</th><th>Răspunsuri</th></tr></thead><tbody id="rows"><tr><td colspan="4">Se încarcă…</td></tr></tbody></table></section></main><script>fetch('/api/admin/parents-feedback').then(r=>r.json()).then(d=>{document.querySelector('#total').textContent=d.totals.ratings;document.querySelector('#sessions').textContent=d.totals.sessions;document.querySelector('#average').textContent=d.totals.average+'/5';document.querySelector('#rows').innerHTML=d.questions.map(q=>'<tr><td>'+q.activity_id+'</td><td>'+q.question_text+'</td><td><span class="stars">'+'★'.repeat(Math.round(q.average))+'☆'.repeat(5-Math.round(q.average))+'</span> '+q.average+'</td><td>'+q.total+'</td></tr>').join('')||'<tr><td colspan="4">Încă nu există feedback.</td></tr>'}).catch(()=>{document.querySelector('#rows').innerHTML='<tr><td colspan="4">Date indisponibile.</td></tr>'});</script></body></html>
