<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Becky’s Garden · Revenim curând</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fffaf4;--ink:#243447;--teal:#168f9f;--coral:#fb7176;--line:#b4dbde}
    *{box-sizing:border-box}
    html,body{height:100%;min-height:100%}
    body{margin:0;display:grid;place-items:center;height:100svh;min-height:100svh;overflow:hidden;padding:clamp(16px,4vw,28px) clamp(16px,5vw,28px) clamp(10px,2vw,18px);background:radial-gradient(circle at 50% 18%,#fff 0,var(--cream) 58%,#f6eddd 100%);color:var(--ink);font-family:'Nunito',sans-serif}
    main{display:flex;flex-direction:column;align-items:center;width:min(760px,100%);height:100%;min-height:0;text-align:center}
    .logo{width:clamp(92px,14vw,132px);height:auto;filter:drop-shadow(0 12px 18px rgba(22,143,159,.12))}
    .eyebrow{margin:24px 0 14px;color:var(--coral);font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;color:var(--teal);font:600 clamp(44px,8vw,82px)/1.04 'Mali',sans-serif;letter-spacing:-.035em}
    p{max-width:540px;margin:24px auto 0;color:#60758b;font-size:clamp(18px,2.5vw,23px);line-height:1.55}
    .line{display:flex;align-items:center;gap:16px;width:min(390px,76%);margin:34px auto 0;color:var(--coral)}
    .line::before,.line::after{content:"";height:2px;flex:1;background:linear-gradient(90deg,transparent,var(--coral))}
    .line::after{transform:scaleX(-1)}
    .line img{width:19px;height:19px;object-fit:contain}
    small{display:block;margin-top:22px;color:#8091a3;font-size:14px;font-weight:700}
    .working-art{display:flex;align-items:flex-end;justify-content:center;width:100%;min-height:0;margin-top:auto;padding-top:12px}
    .working-art img{display:block;width:min(560px,88vw);max-width:100%;height:auto;max-height:min(35svh,360px);object-fit:contain;object-position:center bottom}
    @media (max-width:560px){
      .eyebrow{margin-top:16px;margin-bottom:10px;font-size:11px}
      h1{font-size:clamp(36px,11vw,58px)}
      p{margin-top:14px;font-size:clamp(16px,4.8vw,20px);line-height:1.4}
      .line{margin-top:20px}
      small{margin-top:12px;font-size:12px}
      .working-art{padding-top:8px}
      .working-art img{width:min(390px,94vw);max-height:31svh}
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo-mark-sun.png" alt="Becky’s Garden">
    <div class="eyebrow">Becky’s Garden</div>
    <h1>Se clădește site-ul.</h1>
    <p>Pregătim o nouă experiență pentru joacă, explorare și momente care apropie familiile.</p>
    <div class="line" aria-hidden="true"><img src="/assets/heart_little.png" alt=""></div>
    <small>Revenim curând.</small>
    <div class="working-art" aria-hidden="true">
      <img src="/assets/working_ducks.png" alt="">
    </div>
  </main>
</body>
</html>
