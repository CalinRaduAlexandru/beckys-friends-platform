    <style>
      :root {
        --teal: #33a9ba;
        --teal-dark: #198e9f;
        --coral: #fb7176;
        --navy: #233449;
        --cream: #fffcf8;
        --paper: #fffdfa;
        --mint: #ddf2f3;
        --pink: #faabb9;
        --yellow: #fdcb4b;
        --lav: #cbbad8;
        --green: #6cae78;
        --line: #b4dbde;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        background: var(--cream);
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--cream);
        color: var(--navy);
        font-family: "Nunito", sans-serif;
        font-synthesis: none;
        line-height: 1.5;
      }
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }
      html.fonts-pending .quiz-shell {
        visibility: hidden;
      }
      html.fonts-pending body::before {
        content: "";
        position: fixed;
        z-index: 999;
        inset: 50% auto auto 50%;
        width: 70px;
        height: 70px;
        transform: translate(-50%, -50%);
        background: url("/assets/logo-mark-sun.png") center/contain no-repeat;
        animation: font-loader-pulse 1.15s ease-in-out infinite;
      }
      @keyframes font-loader-pulse {
        50% {
          transform: translate(-50%, -50%) scale(1.055);
          opacity: 0.74;
        }
      }
      html.fonts-ready .quiz-shell {
        animation: fonts-ready-in 0.18s ease-out;
      }
      @keyframes fonts-ready-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .quiz-shell {
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 92% 4%,
            rgba(253, 203, 75, 0.16),
            transparent 20%
          ),
          var(--cream);
      }
      .quiz-header {
        width: min(1160px, calc(100% - 40px));
        margin: 0 auto;
        padding: 18px 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(180, 219, 222, 0.7);
      }
      .quiz-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      .quiz-brand img {
        width: 225px;
        height: 68px;
        object-fit: contain;
        object-position: center;
      }
      .quiz-main {
        width: min(820px, calc(100% - 36px));
        margin: 0 auto;
        padding: 34px 0 70px;
      }
      .quiz-progress {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
      }
      .progress-track {
        height: 10px;
        flex: 1;
        border-radius: 99px;
        background: #f4e8d8;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--coral),
          var(--yellow),
          var(--teal)
        );
        transition: width 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .progress-label {
        min-width: 78px;
        text-align: right;
        color: #7e8fa1;
        font-size: 12px;
        font-weight: 800;
      }
      .quiz-stage {
        position: relative;
        min-height: 560px;
      }
      .quiz-card {
        background: rgba(255, 253, 250, 0.94);
        border: 1px solid rgba(180, 219, 222, 0.8);
        border-radius: 32px;
        padding: 42px 52px;
        box-shadow: 0 20px 55px rgba(35, 52, 72, 0.09);
        animation: card-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .quiz-kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--coral);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .quiz-kicker img {
        width: 16px;
        height: 16px;
      }
      .quiz-card h1,
      .quiz-card h2 {
        margin: 12px 0 0;
        color: var(--teal-dark);
        font:
          600 clamp(34px, 5vw, 58px)/1.03 DynaPuff,
          sans-serif;
        letter-spacing: normal;
        text-wrap: balance;
      }
      .quiz-card h2 {
        font-size: clamp(28px, 4vw, 44px);
      }
      .quiz-card h1 em,
      .quiz-card h2 em {
        color: var(--coral);
        font-style: normal;
      }
      .quiz-lead {
        max-width: 610px;
        margin: 20px 0 0;
        color: #52677d;
        font-size: 18px;
      }
      .duck-note {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 0;
        padding: 12px 16px;
        width: max-content;
        max-width: 100%;
        border-radius: 18px;
        background: #fff4ca;
        color: #6f5a22;
        font-weight: 700;
      }
      .duck-note span {
        font-size: 25px;
      }
      .duel-visual {
        display: flex;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
      }
      .duel-visual img {
        display: block;
        width: min(360px, 82vw);
        height: auto;
        object-fit: contain;
      }
      .quiz-actions {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-top: 32px;
      }
      .primary-btn,
      .secondary-btn {
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        font:
          800 15px Nunito,
          sans-serif;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          filter 0.2s;
      }
      .primary-btn {
        color: #fff;
        background: var(--teal);
        box-shadow: 0 9px 18px rgba(51, 169, 186, 0.23);
      }
      .secondary-btn {
        color: var(--navy);
        background: #fff;
        border: 1px solid var(--line);
      }
      .primary-btn:hover,
      .secondary-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 22px rgba(35, 52, 72, 0.14);
        filter: brightness(1.04);
      }
      .answer-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 26px;
      }
      .answer-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .answer {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 56px;
        padding: 13px 15px;
        border: 1px solid rgba(180, 219, 222, 0.8);
        border-radius: 17px;
        background: #fff;
        cursor: pointer;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          border-color 0.18s,
          background 0.18s;
      }
      .answer:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(35, 52, 72, 0.08);
      }
      .answer input {
        position: absolute;
        opacity: 0;
      }
      .answer-mark {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        border: 2px solid var(--line);
        border-radius: 7px;
        background: #fff;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 14px;
        line-height: 1;
      }
      .answer input:checked + .answer-mark {
        border-color: var(--coral);
        background: var(--coral);
      }
      .answer input:checked + .answer-mark:after {
        content: "✓";
      }
      .answer:has(input[type="radio"]) .answer-mark {
        border-radius: 50%;
      }
      .answer:has(input:checked) {
        border-color: var(--coral);
        background: #fff5f3;
        box-shadow: 0 5px 13px rgba(251, 113, 118, 0.1);
      }
      .answer-text {
        font-family: "Nunito", sans-serif;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
      }
      .answer:has(input:checked) .answer-text {
        font-weight: 700;
      }
      .answer small {
        display: block;
        color: #7e8fa1;
        font-size: 11px;
      }
      .limit-note {
        margin-top: 14px;
        color: #8090a1;
        font-size: 12px;
        font-weight: 700;
      }
      .rank-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 26px;
      }
      .rank-choice {
        position: relative;
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 62px;
        padding: 12px 15px;
        border: 1px solid rgba(180, 219, 222, 0.8);
        border-radius: 17px;
        background: #fff;
        color: var(--navy);
        font-family: "Nunito", sans-serif;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        cursor: pointer;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          border-color 0.18s,
          background 0.18s;
      }
      .rank-choice:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(35, 52, 72, 0.08);
      }
      .rank-choice.is-ranked {
        border-color: var(--coral);
        background: #fff5f3;
        box-shadow: 0 5px 13px rgba(251, 113, 118, 0.1);
      }
      .rank-choice > span:last-child,
      .rank-choice.is-ranked > span:last-child {
        font-weight: 700;
      }
      .rank-choice .rank-number {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        flex: 0 0 29px;
        border-radius: 7px;
        border: 2px solid var(--line);
        background: #fff;
        color: #8ca1ad;
        font:
          900 14px/1 Nunito,
          sans-serif;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }
      .rank-choice.is-ranked .rank-number {
        border-color: var(--coral);
        background: var(--coral);
        color: #fff;
      }
      .rank-choice.is-full:not(.is-ranked) {
        opacity: 0.68;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 24px;
      }
      .text-input,
      .textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 13px 15px;
        background: #fff;
        color: var(--navy);
        font:
          600 15px Nunito,
          sans-serif;
        outline: none;
      }
      .textarea {
        min-height: 126px;
        resize: vertical;
      }
      .text-input:focus,
      .textarea:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 4px rgba(51, 169, 186, 0.12);
      }
      label.field-label {
        display: block;
        margin: 0 0 7px;
        color: #5e7186;
        font-size: 12px;
        font-weight: 800;
      }
      .scale {
        display: grid;
        grid-template-columns: repeat(11, 1fr);
        gap: 7px;
        margin-top: 26px;
      }
      .scale-option {
        position: relative;
      }
      .scale-option input {
        position: absolute;
        opacity: 0;
      }
      .scale-option label {
        display: grid;
        place-items: center;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #f4e8d8;
        color: #7d6b51;
        font-weight: 900;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s,
          color 0.2s;
      }
      .scale-option label:hover {
        transform: translateY(-4px);
      }
      .scale-option input:checked + label {
        background: var(--teal);
        color: #fff;
        transform: translateY(-5px) scale(1.12);
        box-shadow: 0 8px 14px rgba(51, 169, 186, 0.24);
      }
      .scale-legend {
        display: flex;
        justify-content: space-between;
        color: #8391a1;
        font-size: 12px;
        margin-top: 8px;
      }
      .mood-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 20px;
        padding: 13px 15px;
        border-radius: 18px;
        background: #fff4ca;
        color: #6f5a22;
        font-weight: 800;
      }
      .mood-duck {
        font-size: 30px;
        transition: transform 0.3s;
      }
      .duel-intro {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .duel-count {
        color: #7e8fa1;
        font-size: 13px;
        font-weight: 900;
      }
      .duel-rounds {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        margin-top: 18px;
      }
      .duel-round {
        height: 7px;
        border-radius: 99px;
        background: #dceae9;
        transition:
          background 0.3s,
          transform 0.3s;
      }
      .duel-round.is-done {
        background: var(--teal);
      }
      .duel-round.is-current {
        background: var(--coral);
        transform: scaleY(1.45);
      }
      .duel-arena {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        gap: 15px;
        margin-top: 28px;
      }
      .duel-option {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: 11px;
      }
      .duel-card {
        position: relative;
        width: 100%;
        min-height: 238px;
        padding: 25px 18px 20px;
        border: 2px solid var(--line);
        border-radius: 25px;
        background: linear-gradient(145deg, #fff, #f1fbfb);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition:
          transform 0.22s,
          box-shadow 0.22s,
          border-color 0.22s,
          filter 0.22s,
          opacity 0.22s;
      }
      .duel-option:nth-child(3) .duel-card {
        background: linear-gradient(145deg, #fff, #fff3f1);
        border-color: #f6c3c5;
      }
      .duel-card:hover {
        transform: translateY(-7px) rotate(-1deg);
        box-shadow: 0 16px 25px rgba(35, 52, 72, 0.13);
        filter: brightness(1.04);
      }
      .duel-option:nth-child(3) .duel-card:hover {
        transform: translateY(-7px) rotate(1deg);
      }
      .duel-card:disabled {
        cursor: default;
      }
      .duel-card.is-replacing {
        opacity: 0;
        transform: scale(0.96);
      }
      .duel-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      .duel-card h3 {
        margin: 0;
        color: var(--teal-dark);
        font:
          600 25px/1.05 DynaPuff,
          sans-serif;
      }
      .duel-option:nth-child(3) .duel-card h3 {
        color: var(--coral);
      }
      .duel-card p {
        margin: 8px 0 0;
        color: #667a8d;
        font-size: 12px;
      }
      .versus {
        align-self: center;
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--navy);
        color: #fff;
        font:
          900 11px Nunito,
          sans-serif;
        box-shadow: 0 5px 0 rgba(35, 52, 72, 0.12);
      }
      .duel-card.chosen {
        animation: chosen 0.48s ease;
        border-color: var(--teal);
        box-shadow:
          0 0 0 5px rgba(51, 169, 186, 0.12),
          0 17px 25px rgba(51, 169, 186, 0.17);
      }
      @keyframes chosen {
        50% {
          transform: translateY(-12px) scale(1.04) rotate(-2deg);
        }
        to {
          transform: translateY(0) scale(1);
        }
      }
      .duel-card {
        overflow: hidden;
      }
      .duel-pick {
        border: 0;
        color: inherit;
      }
      .duel-info {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 13px;
        background: #fff;
        color: var(--teal-dark);
        font:
          800 11px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .duel-info:hover {
        border-color: var(--teal);
        background: #eff9f8;
      }
      .concept-modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(35, 52, 73, 0.42);
        backdrop-filter: blur(5px);
      }
      .concept-modal-card {
        width: min(620px, 100%);
        max-height: calc(100vh - 44px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 27px;
        background: var(--paper);
        box-shadow: 0 28px 80px rgba(35, 52, 73, 0.25);
        text-align: left;
      }
      .concept-modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
      }
      .concept-modal-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .concept-modal-icon {
        font-size: 38px;
      }
      .concept-modal-card h3 {
        margin: 0;
        color: var(--teal-dark);
        font:
          600 29px/1.1 DynaPuff,
          sans-serif;
      }
      .concept-modal-close {
        border: 0;
        background: transparent;
        color: #718398;
        font-size: 30px;
        line-height: 1;
        cursor: pointer;
      }
      .concept-modal-summary {
        margin: 16px 0;
        padding: 13px 15px;
        border-radius: 15px;
        background: #fff4ca;
        color: #6f5a22;
        font-weight: 800;
      }
      .concept-detail {
        margin-top: 12px;
        padding: 14px 15px;
        border: 1px solid rgba(180, 219, 222, 0.7);
        border-radius: 16px;
        background: #fff;
      }
      .concept-detail strong {
        display: block;
        margin-bottom: 4px;
        color: var(--coral);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .concept-detail p {
        margin: 0;
        color: #52677d;
        font-size: 14px;
        line-height: 1.55;
      }
      .info-note {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 16px 0 0;
        padding: 12px 15px;
        border: 1px solid #f0d67f;
        border-radius: 16px;
        background: #fff4ca;
        color: #6f5a22;
        font-size: 13px;
        font-weight: 800;
      }
      .info-note-icon {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        display: grid;
        place-items: center;
        border: 2px solid currentColor;
        border-radius: 50%;
        font:
          900 13px/1 Nunito,
          sans-serif;
      }
      .ranking.is-editable .rank-row {
        cursor: grab;
        grid-template-columns: 34px 38px minmax(0, 1fr);

      function removeHappyDuckBackground(image) {
        const { data, width, height } = image,
          count = width * height,
          background = new Uint8Array(count),
          queue = new Int32Array(count);
        let head = 0,
          tail = 0;
        const isDark = (index) => {
          const offset = index * 4;
          return Math.max(data[offset], data[offset + 1], data[offset + 2]) < 48;
        };
        const add = (index) => {
          if (background[index] || !isDark(index)) return;
          background[index] = 1;
          queue[tail++] = index;
        };
        for (let x = 0; x < width; x++) {
          add(x);
          add((height - 1) * width + x);
        }
        for (let y = 1; y < height - 1; y++) {
          add(y * width);
          add(y * width + width - 1);
        }
        while (head < tail) {
          const index = queue[head++],
            x = index % width,
            y = Math.floor(index / width);
          if (x) add(index - 1);
          if (x + 1 < width) add(index + 1);
          if (y) add(index - width);
          if (y + 1 < height) add(index + width);
          if (x && y) add(index - width - 1);
          if (x + 1 < width && y) add(index - width + 1);
          if (x && y + 1 < height) add(index + width - 1);
          if (x + 1 < width && y + 1 < height) add(index + width + 1);
        }
        // Expand the outside mask through compressed/anti-aliased dark edges.
        // This reaches enclosed background gaps around the neck and wings,
        // without crossing the bright body towards eyes or interior outlines.
        const isSoftDark = (index) => {
          const offset = index * 4,
            red = data[offset],
            green = data[offset + 1],
            blue = data[offset + 2];
          return Math.max(red, green, blue) < 148;
        };
        for (let pass = 0; pass < 4; pass++) {
          const additions = [];
          for (let y = 1; y < height - 1; y++) {
            for (let x = 1; x < width - 1; x++) {
              const index = y * width + x;
              if (background[index] || !isSoftDark(index)) continue;
              const touchesOutside =
                background[index - 1] ||
                background[index + 1] ||
                background[index - width] ||
                background[index + width] ||
                background[index - width - 1] ||
                background[index - width + 1] ||
                background[index + width - 1] ||
                background[index + width + 1];
              if (touchesOutside) additions.push(index);
            }
          }
          if (!additions.length) break;
          additions.forEach((index) => {
            background[index] = 1;
          });
        }
        const watermarkLeft = Math.floor(width * 0.6),
          watermarkBottom = Math.ceil(height * 0.15);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const index = y * width + x,
              offset = index * 4;
            if (
              background[index] ||
              (x >= watermarkLeft && y <= watermarkBottom)

              data[offset + 3] = 0;
              continue;
            }
            const touchesBackground =
              (x > 0 && background[index - 1]) ||
              (x + 1 < width && background[index + 1]) ||
              (y > 0 && background[index - width]) ||
              (y + 1 < height && background[index + width]);

                data[offset],
                data[offset + 1],
                data[offset + 2],
              );
              if (lightness < 105)
                data[offset + 3] = Math.min(
                  data[offset + 3],
                  Math.max(0, Math.round(((lightness - 24) / 81) * 255)),
                );
            }
          }
        }
        return image;
      }

      function removeEdgeBlack(image) {
        const { data, width, height } = image,
          count = width * height,
          seen = new Uint8Array(count),
          queue = new Int32Array(count);
        let head = 0,
          tail = 0;
        const isBackground = (index) => {
          const offset = index * 4,
            red = data[offset],
            green = data[offset + 1],
            blue = data[offset + 2],
            bright = Math.max(red, green, blue),
            dark = Math.min(red, green, blue);
          return bright < 184 && bright - dark < 82;
        };
        const add = (index) => {
          if (seen[index] || !isBackground(index)) return;
          seen[index] = 1;
          queue[tail++] = index;
        };
        for (let x = 0; x < width; x++) {
          add(x);
          add((height - 1) * width + x);
        }
        for (let y = 0; y < height; y++) {
          add(y * width);
          add(y * width + width - 1);
        }
        while (head < tail) {
          const index = queue[head++],
            x = index % width,
            y = Math.floor(index / width);
          if (x) add(index - 1);
          if (x + 1 < width) add(index + 1);
          if (y) add(index - width);
          if (y + 1 < height) add(index + width);
        }
        // Some frames contain an isolated dark patch inside the otherwise
        // light background (usually underneath the duck). Remove sizeable
        // connected dark components too, while keeping small dark details
        // such as eyes and outlines intact.
        const componentSeen = new Uint8Array(count),
          componentQueue = new Int32Array(count),
          componentPixels = new Int32Array(count);
        for (let start = 0; start < count; start++) {
          if (componentSeen[start] || !isBackground(start)) continue;
          let componentHead = 0,
            componentTail = 0,
            pixelCount = 0,
            maxY = 0;
          componentSeen[start] = 1;
          componentQueue[componentTail++] = start;
          while (componentHead < componentTail) {
            const index = componentQueue[componentHead++],
              x = index % width,
              y = Math.floor(index / width);
            componentPixels[pixelCount++] = index;
            maxY = Math.max(maxY, y);
            if (x && !componentSeen[index - 1] && isBackground(index - 1)) {
              componentSeen[index - 1] = 1;
              componentQueue[componentTail++] = index - 1;
            }
            if (
              x + 1 < width &&
              !componentSeen[index + 1] &&
              isBackground(index + 1)
            ) {
              componentSeen[index + 1] = 1;
              componentQueue[componentTail++] = index + 1;
            }
            if (
              y &&
              !componentSeen[index - width] &&
              isBackground(index - width)
            ) {
              componentSeen[index - width] = 1;
              componentQueue[componentTail++] = index - width;
            }
            if (
              y + 1 < height &&
              !componentSeen[index + width] &&
              isBackground(index + width)
            ) {
              componentSeen[index + width] = 1;
              componentQueue[componentTail++] = index + width;
            }
          }
          if (pixelCount >= 120 && maxY >= height * 0.52)
            for (let pixel = 0; pixel < pixelCount; pixel++)
              data[componentPixels[pixel] * 4 + 3] = 0;
        }
        for (let index = 0; index < count; index++)
          if (seen[index]) data[index * 4 + 3] = 0;
        return image;
      }

              `<p class="quiz-lead open-answer-lead">Poate fi un detaliu, o nevoie, o problemă ignorată de organizatori sau orice altceva nu ai regăsit în întrebări.</p><div class="optional-badge">OPȚIONAL · poți trimite fără să completezi acest câmp</div><textarea class="textarea" name="mainOpen" placeholder="Pentru familia noastră, un eveniment reușit...">${esc(state.answers.mainOpen || "")}</textarea><p class="submit-status" aria-live="polite"></p>`,
              navigationButtons("", true),
            ),
          );
        if (state.step === 13) return renderSuccess();
      }
      function startDuels() {
        const deck = shuffle(concepts);
        state.duels = [];
        state.duelIndex = 0;
        state.duelChampion = deck.shift();
        state.duelChallenger = deck.shift();
        state.duelQueue = deck;
        if (Math.random() > 0.5)
          [state.duelChampion, state.duelChallenger] = [
            state.duelChallenger,
            state.duelChampion,
          ];
        concepts.forEach((c) => (state.stats[c.name] = { shown: 0, wins: 0 }));
      }
      function duelCardContent(concept) {
        return `<span class="duel-icon">${concept.icon}</span><h3>${esc(concept.name)}</h3><p>${esc(concept.desc)}</p>`;
      }
      function duelCardTemplate(concept) {
        return `<div class="duel-option"><button class="duel-card duel-pick" type="button" data-pick="${esc(concept.name)}">${duelCardContent(concept)}</button><button class="duel-info" type="button" data-info="${esc(concept.name)}">Mai multe informații</button></div>`;
      }
      function conceptModalMarkup() {
        return '<div class="concept-modal hidden" id="conceptModal" role="dialog" aria-modal="true" aria-labelledby="conceptModalTitle"><div class="concept-modal-card" id="conceptModalCard"></div></div>';
      }
      function renderDuel() {
        const left = state.duelChampion,
          right = state.duelChallenger;
        if (!left || !right) {
          state.step = 11;
          return render();
        }
        const rounds = Array.from(
          { length: concepts.length - 1 },
          (_, index) =>
            `<span class="duel-round ${index < state.duelIndex ? "is-done" : index === state.duelIndex ? "is-current" : ""}"></span>`,
        ).join("");
        show(
          `<article class="quiz-card"><div class="duel-intro"><div><div class="quiz-kicker"><img src="/assets/heart_little.png" alt=""> DUELUL PREFERINȚELOR</div><h2>Alege preferințele<br><em>pentru familia ta!</em></h2></div><span class="duel-count">${state.duelIndex + 1} / ${concepts.length - 1}</span></div><div class="duel-rounds" aria-label="Duelul ${state.duelIndex + 1} din ${concepts.length - 1}">${rounds}</div><div class="duel-arena">${duelCardTemplate(left)}<span class="versus">SAU</span>${duelCardTemplate(right)}</div><div class="info-note"><span class="info-note-icon" aria-hidden="true">i</span><span>Alege instinctiv. Opțiunea aleasă rămâne; doar cealaltă se schimbă.</span></div><div class="quiz-actions"><button class="secondary-btn" type="button" data-back><span aria-hidden="true">←</span> Înapoi</button></div></article>${conceptModalMarkup()}`,
        );
        stage
          .querySelectorAll("[data-pick]")
          .forEach((btn) =>
            btn.addEventListener("click", () => advanceDuel(btn)),
          );
        stage
          .querySelectorAll("[data-info]")
          .forEach((btn) =>
            btn.addEventListener("click", () =>
              openConceptInfo(btn.dataset.info),
            ),
          );
        updateProgress();
      }
      function openConceptInfo(name) {
        const concept = concepts.find((item) => item.name === name),
          modal = stage.querySelector("#conceptModal"),
          card = stage.querySelector("#conceptModalCard");
        if (!concept || !modal || !card) return;
        card.innerHTML = `<div class="concept-modal-head"><div class="concept-modal-title"><span class="concept-modal-icon">${concept.icon}</span><h3 id="conceptModalTitle">${esc(concept.name)}</h3></div><button class="concept-modal-close" type="button" aria-label="Închide">×</button></div><div class="concept-modal-summary">${esc(concept.desc)}</div><div class="concept-detail"><strong>Cum arată evenimentul</strong><p>${esc(concept.format)}</p></div><div class="concept-detail"><strong>Ce face copilul</strong><p>${esc(concept.child)}</p></div><div class="concept-detail"><strong>Rolul părintelui</strong><p>${esc(concept.parent)}</p></div>`;
        modal.classList.remove("hidden");
        const close = () => modal.classList.add("hidden");
        card
          .querySelector(".concept-modal-close")
          .addEventListener("click", close);
        modal.onclick = (event) => {
          if (event.target === modal) close();
        };
        card.querySelector(".concept-modal-close").focus();
      }
      function advanceDuel(selectedButton) {
        const buttons = [...stage.querySelectorAll("[data-pick]")];
        if (buttons.some((button) => button.disabled)) return;
        const rejectedButton = buttons.find(
            (button) => button !== selectedButton,
          ),
          selectedCard = selectedButton.closest(".duel-card"),
          rejectedCard = rejectedButton.closest(".duel-card");
        const winner = concepts.find(
            (concept) => concept.name === selectedButton.dataset.pick,
          ),
          rejected = concepts.find(
            (concept) => concept.name === rejectedButton.dataset.pick,
          );
        if (!winner || !rejected || !selectedCard || !rejectedCard) return;
        buttons.forEach((button) => (button.disabled = true));
        state.stats[winner.name].shown++;
        state.stats[winner.name].wins++;
        state.stats[rejected.name].shown++;
        state.duels.push({ winner: winner.name, rejected: rejected.name });
        state.duelIndex++;
        state.duelChampion = winner;
        selectedCard.classList.add("chosen");
        rejectedCard.classList.add("is-replacing");
        const next = state.duelQueue.shift();
        if (!next) {
          setTimeout(() => {
            state.conceptRanking = [];
            state.step = 11;
            render();
          }, 480);
          return;
        }
        state.duelChallenger = next;
        setTimeout(() => {
          rejectedButton.dataset.pick = next.name;
          rejectedButton.innerHTML = duelCardContent(next);
          const infoButton =
            rejectedCard.parentElement.querySelector("[data-info]");
          infoButton.dataset.info = next.name;
          rejectedCard.classList.remove("is-replacing");
          selectedCard.classList.remove("chosen");
          buttons.forEach((button) => (button.disabled = false));
          const counter = stage.querySelector(".duel-count");
          if (counter)
            counter.textContent = `${state.duelIndex + 1} / ${concepts.length - 1}`;
          const roundTrack = stage.querySelector(".duel-rounds");
          if (roundTrack) {
            roundTrack.setAttribute(
              "aria-label",
              `Duelul ${state.duelIndex + 1} din ${concepts.length - 1}`,
            );
            roundTrack
              .querySelectorAll(".duel-round")
              .forEach((round, index) => {
                round.classList.toggle("is-done", index < state.duelIndex);
                round.classList.toggle("is-current", index === state.duelIndex);
              });
          }
          const pagerCopy = stage.querySelector(".section-pager-copy");
          if (pagerCopy)
            pagerCopy.textContent = `Etapa 3 · pasul 2/4 · duelul ${state.duelIndex + 1}/${concepts.length - 1}`;
          updateProgress();
        }, 360);
      }
      function initialConceptRanking() {
        // Duelul nu compară toate ideile între ele: fiecare rundă creează
        // o relație directă „winner > rejected”. Construim clasamentul din
        // aceste relații, astfel încât nicio alegere explicită să nu fie
        // inversată de ordinea în care au apărut ulterior cărțile.
        const children = new Map(
          concepts.map((concept) => [concept.name, []]),
        );
        const duelOrder = new Map();
        state.duels.forEach((duel, index) => {
          if (!children.has(duel.winner) || !children.has(duel.rejected))
            return;
          children.get(duel.winner).push(duel.rejected);
          duelOrder.set(duel.rejected, index);
        });

        const root = state.duelChampion?.name;
        if (!root) return [];
        const ranking = [];
        const visit = (name) => {
          ranking.push(name);
          children
            .get(name)
            .slice()
            .sort((a, b) => (duelOrder.get(b) ?? -1) - (duelOrder.get(a) ?? -1))
            .forEach(visit);
        };
        visit(root);

        // Fallback defensiv pentru date vechi sau un duel întrerupt.
        concepts.forEach((concept) => {
          if (!ranking.includes(concept.name)) ranking.push(concept.name);
        });
        return ranking;
      }
      function renderPreferenceReview() {
        if (!state.conceptRanking.length)
          state.conceptRanking = initialConceptRanking();
        const rows = state.conceptRanking
          .map((name, index) => {
            const concept = concepts.find((item) => item.name === name);
            return `<div class="rank-row" draggable="true" data-concept-rank="${esc(name)}"><span class="drag-handle" aria-label="Trage pentru a muta">⠿</span><span class="rank-number">${index + 1}</span><span class="rank-name">${concept.icon} ${esc(concept.name)}</span></div>`;
          })
          .join("");
        show(
          `<article class="quiz-card"><div class="quiz-kicker"><img src="/assets/heart_little.png" alt=""> REZULTATUL DUELULUI</div><h2>Așa am interpretat<br><em>alegerile tale.</em></h2><p class="quiz-lead">Duelul a comparat perechi, nu toate ideile între ele. Aceasta este o ordine propusă pe baza alegerilor tale — verifică mai ales primele trei poziții și rearanjează dacă nu te reprezintă.</p><div class="info-note ranking-note"><span class="info-note-icon" aria-hidden="true">↕</span><span><strong>Poți rearanja clasamentul.</strong><br><strong>Pe telefon:</strong> ține apăsat aproximativ o jumătate de secundă, apoi trage cardul. O glisare normală va continua să deruleze pagina.</span></div><div class="ranking is-editable">${rows}</div>${nextButton("Primele trei mă reprezintă")}</article>`,
        );
        bindPreferenceRanking();
      }
      function moveConcept(from, to) {
        if (
          from < 0 ||
          to < 0 ||
          from === to ||
          to >= state.conceptRanking.length
        )
          return;
        const list = stage.querySelector(".ranking.is-editable");
        if (!list) return;
        const rows = [...list.querySelectorAll(".rank-row")],
          before = new Map(
            rows.map((row) => [
              row.dataset.conceptRank,
              row.getBoundingClientRect(),
            ]),
          ),
          movedName = state.conceptRanking[from];
        const [item] = state.conceptRanking.splice(from, 1);
        state.conceptRanking.splice(to, 0, item);
        state.conceptRanking.forEach((name) => {
          const row = rows.find(
            (candidate) => candidate.dataset.conceptRank === name,
          );
          if (row) list.appendChild(row);
        });
        [...list.querySelectorAll(".rank-row")].forEach((row, index) => {
          row.querySelector(".rank-number").textContent = String(index + 1);
          const previous = before.get(row.dataset.conceptRank),
            next = row.getBoundingClientRect(),
            deltaX = previous.left - next.left,
            deltaY = previous.top - next.top;
          if (deltaX || deltaY)
            row.animate(
              [
                { transform: `translate(${deltaX}px,${deltaY}px)` },
                { transform: "translate(0,0)" },
              ],
              { duration: 320, easing: "cubic-bezier(.2,.8,.2,1)" },
            );
        });
        const moved = list.querySelector(
          `[data-concept-rank="${CSS.escape(movedName)}"]`,
        );
        if (moved) {
          moved.classList.remove("is-settling");
          void moved.offsetWidth;
          moved.classList.add("is-settling");
          setTimeout(() => moved.classList.remove("is-settling"), 1500);
        }
      }
      function bindPreferenceRanking() {
        const list = stage.querySelector(".ranking.is-editable");
        let draggedName = "",
          dragScrollY = window.scrollY;
        list.querySelectorAll(".rank-row").forEach((row) => {
          if (window.matchMedia("(pointer: coarse)").matches)
            row.draggable = false;
          row.addEventListener("dragstart", (event) => {
            if (window.matchMedia("(pointer: coarse)").matches) {
              event.preventDefault();
              return;
            }
            draggedName = row.dataset.conceptRank;
            dragScrollY = window.scrollY;
            row.classList.add("is-dragging");
            event.dataTransfer.effectAllowed = "move";
          });
          row.addEventListener("dragover", (event) => {
            event.preventDefault();
            window.scrollTo({ top: dragScrollY, behavior: "auto" });
            row.classList.add("is-over");
          });
          row.addEventListener("dragleave", () =>
            row.classList.remove("is-over"),
          );
          row.addEventListener("drop", (event) => {
            event.preventDefault();
            window.scrollTo({ top: dragScrollY, behavior: "auto" });
            const from = state.conceptRanking.indexOf(draggedName),
              to = state.conceptRanking.indexOf(row.dataset.conceptRank);
            moveConcept(from, to);
          });
          row.addEventListener("dragend", () => {
            window.scrollTo({ top: dragScrollY, behavior: "auto" });
            list
              .querySelectorAll(".rank-row")
              .forEach((item) =>
                item.classList.remove("is-dragging", "is-over"),
              );
          });
          let targetRow = null,
            dragGhost = null,
            pressTimer = null,
            touchDragActive = false,
            pointerId = null,
            startX = 0,
            startY = 0,
            pointerOffsetY = 0;
          const cancelPress = () => {
            clearTimeout(pressTimer);
            pressTimer = null;
            row.classList.remove("is-long-pressing");
          };
          const clearTouchVisuals = () => {
            cancelPress();
            dragGhost?.remove();
            dragGhost = null;
            touchDragActive = false;
            pointerId = null;
            document.body.classList.remove("is-ranking-dragging");
            list
              .querySelectorAll(".rank-row")
              .forEach((item) =>
                item.classList.remove(
                  "is-dragging",
                  "is-over",
                  "is-push-up",
                  "is-push-down",
                  "is-long-pressing",
                ),
              );
          };
          row.addEventListener("pointerdown", (event) => {
            if (event.pointerType === "mouse") return;
            startX = event.clientX;
            startY = event.clientY;
            pointerId = event.pointerId;
            targetRow = row;
            row.classList.add("is-long-pressing");
            pressTimer = setTimeout(() => {
              if (!row.isConnected || pointerId !== event.pointerId) return;
              touchDragActive = true;
              draggedName = row.dataset.conceptRank;
              dragScrollY = window.scrollY;
              document.body.classList.add("is-ranking-dragging");
              row.classList.remove("is-long-pressing");
              row.classList.add("is-dragging");
              const bounds = row.getBoundingClientRect();
              pointerOffsetY = startY - bounds.top;
              dragGhost = row.cloneNode(true);
              dragGhost.classList.remove("is-dragging", "is-over");
              dragGhost.classList.add("rank-drag-ghost");
              dragGhost.style.left = `${bounds.left}px`;
              dragGhost.style.top = `${bounds.top}px`;
              dragGhost.style.width = `${bounds.width}px`;
              dragGhost.style.height = `${bounds.height}px`;
              document.body.appendChild(dragGhost);
              try {
                row.setPointerCapture(event.pointerId);
              } catch {
                // Synthetic events and older mobile browsers may not expose capture.
              }
              navigator.vibrate?.(18);
            }, 480);
          });
          row.addEventListener(
            "touchmove",
            (event) => {
              if (touchDragActive) event.preventDefault();
            },
            { passive: false },
          );
          row.addEventListener("contextmenu", (event) =>
            event.preventDefault(),
          );
          row.addEventListener("pointermove", (event) => {
            if (event.pointerType === "mouse" || pointerId !== event.pointerId)
              return;
            if (!touchDragActive) {
              if (
                Math.hypot(event.clientX - startX, event.clientY - startY) > 9
              )
                cancelPress();
              return;
            }
            event.preventDefault();
            if (dragGhost) {
              dragGhost.style.top = `${event.clientY - pointerOffsetY}px`;
              dragGhost.style.transform = "scale(1.02)";
            }
            if (event.clientY < 72) window.scrollBy(0, -14);
            else if (event.clientY > window.innerHeight - 72)
              window.scrollBy(0, 14);
            const candidate = document
              .elementFromPoint(event.clientX, event.clientY)
              ?.closest(".rank-row");
            const draggedIndex = state.conceptRanking.indexOf(draggedName),
              candidateIndex = candidate
                ? state.conceptRanking.indexOf(candidate.dataset.conceptRank)
                : -1;
            list.querySelectorAll(".rank-row").forEach((item) => {
              item.classList.toggle("is-over", item === candidate);
              item.classList.toggle(
                "is-push-up",
                item === candidate && candidateIndex < draggedIndex,
              );
              item.classList.toggle(
                "is-push-down",
                item === candidate && candidateIndex > draggedIndex,
              );
            });
            if (candidate) targetRow = candidate;
          });
          const finishTouchDrag = (event, cancelled = false) => {
            if (event.pointerType === "mouse" || pointerId !== event.pointerId)
              return;
            if (!touchDragActive) {
              cancelPress();
              pointerId = null;
              return;
            }
            event.preventDefault();
            const from = state.conceptRanking.indexOf(draggedName),
              to = state.conceptRanking.indexOf(targetRow?.dataset.conceptRank);
            draggedName = "";
            clearTouchVisuals();
            window.scrollTo({ top: dragScrollY, behavior: "auto" });
            if (!cancelled && from !== to) moveConcept(from, to);
          };
          row.addEventListener("pointerup", finishTouchDrag);
          row.addEventListener("pointercancel", (event) =>
            finishTouchDrag(event, true),
          );
        });
      }
      async function submitSurvey() {
        const button = stage.querySelector("[data-submit]"),
          status = stage.querySelector(".submit-status");
        state.answers.mainOpen =
          stage.querySelector("[name=mainOpen]")?.value.trim() || "";
        state.answers.conceptRanking = [...state.conceptRanking];
        button.disabled = true;
        button.textContent = "Se trimit răspunsurile…";
        status.textContent = "Rățușca pune răspunsurile în ordine.";
        try {
          const response = await fetch("/api/event-survey", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              answers: state.answers,
              duels: state.duels,
              conceptRanking: state.conceptRanking,
            }),
          });
          if (!response.ok) throw new Error("Submit failed");
          trackFunnel("complete", 13);
          state.step = 13;
          render();
        } catch {
          button.disabled = false;
          button.textContent = "Încearcă din nou";
          status.textContent =
            "Răspunsurile nu au putut fi trimise. Mai încearcă o dată.";
        }
      }
      function renderSuccess() {
        show(
          `<article class="quiz-card success-card"><div class="success-duck-stage"><video class="success-duck-source" id="successDuckVideo" src="/assets/animated_characters/duck_throwing_conffetti.mp4" muted playsinline preload="auto"></video><canvas class="success-duck-canvas" id="successDuckCanvas" aria-hidden="true"></canvas></div><div class="quiz-kicker" style="justify-content:center"><img src="/assets/heart_little.png" alt=""> CHESTIONAR COMPLETAT</div><h2>Mulțumim!<br><em>Răspunsurile au ajuns.</em></h2><p class="quiz-lead" style="margin-left:auto;margin-right:auto">Ne vor ajuta să construim evenimente mai relevante pentru familii și momente de conexiune care chiar merită timpul vostru.</p></article>`,
        );
        playSuccessAnimation();
      }
      function playSuccessAnimation() {
        const video = stage.querySelector("#successDuckVideo"),
          canvas = stage.querySelector("#successDuckCanvas"),
          holder = stage.querySelector(".success-duck-stage");
        if (!video || !canvas || !holder) return launchConfetti();
        const context = canvas.getContext("2d", { willReadFrequently: true }),
          processingCanvas = document.createElement("canvas"),
          processingContext = processingCanvas.getContext("2d", {
            willReadFrequently: true,
          });
        const confettiAt = 0.7;
        let confettiStarted = false,
          animationFinished = false;
        const startConfetti = () => {
          if (confettiStarted) return;
          confettiStarted = true;
          launchConfetti();
        };
        const scheduleFrame = () =>
          video.requestVideoFrameCallback
            ? video.requestVideoFrameCallback(draw)
            : requestAnimationFrame(draw);
        const draw = () => {
          if (animationFinished) return;
          if (!video.videoWidth || !video.videoHeight) return;
          if (!canvas.dataset.sized) {
            canvas.width = 240;
            canvas.height = Math.round(
              (240 * video.videoHeight) / video.videoWidth,
            );
            processingCanvas.width = canvas.width;
            processingCanvas.height = canvas.height;
            canvas.dataset.sized = "true";
          }
          processingContext.clearRect(
            0,
            0,
            processingCanvas.width,
            processingCanvas.height,
          );
          processingContext.drawImage(
            video,
            0,
            0,
            processingCanvas.width,
            processingCanvas.height,
          );
          context.putImageData(
            removeEdgeBlack(
              processingContext.getImageData(
                0,
                0,
                processingCanvas.width,
                processingCanvas.height,
              ),
            ),
            0,
            0,
          );
          holder.classList.add("is-animating");
          if (video.currentTime >= confettiAt) startConfetti();
          if (!video.paused && !video.ended) scheduleFrame();
        };
        video.addEventListener(
          "loadeddata",
          () => {
            draw();
            video.play().then(scheduleFrame).catch(startConfetti);
          },
          { once: true },
        );
        video.addEventListener("timeupdate", () => {
          if (video.currentTime >= confettiAt) startConfetti();
        });
        video.addEventListener(
          "ended",
          () => {
            draw();
            animationFinished = true;
            startConfetti();
            video.pause();
            holder.classList.add("is-animating");
          },
          { once: true },
        );
      }
      function launchConfetti() {
        const colors = ["#FB7176", "#FDCB4B", "#33A9BA", "#CBBAD8", "#6CAE78"];
        for (let i = 0; i < 90; i++) {
          const piece = document.createElement("i");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "vw";
          piece.style.background = colors[i % colors.length];
          piece.style.setProperty(
            "--duration",
            2.6 + Math.random() * 2.2 + "s",
          );
          piece.style.setProperty("--drift", -120 + Math.random() * 240 + "px");
          piece.style.animationDelay = Math.random() * 0.7 + "s";
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 5600);
        }
      }
      async function startQuizWhenFontsAreReady() {
        const fonts = [
            "600 48px 'DynaPuff'",
            "400 16px 'Nunito'",
            "800 16px 'Nunito'",
          ],
          sample = "Becky Țară își păstrează răspunsurile anonime";
        await Promise.all(
          fonts.map((font) => document.fonts.load(font, sample)),
        );
        await document.fonts.ready;
        document.documentElement.classList.remove("fonts-pending");
        document.documentElement.classList.add("fonts-ready");
        trackFunnel("open", 0);
        render();
        document.fonts.load("700 24px 'DynaPuff'", sample);
      }
      startQuizWhenFontsAreReady();
    </script>
